apiVersion: dev.crossplane.io/v1alpha1
kind: Project
metadata:
  name: kubecon-network
spec:
  repository: xpkg.crossplane.io/kubecon/network
  description: Team networks (VPC + subnet + security group) for the simulate demo.
  schemas:
    languages:
      - python
  dependencies:
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.crossplane.io/crossplane-contrib/provider-aws-ec2
        version: "v2.9.0"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-go-templating
        version: "v0.13.2"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
        version: "v0.7.3"
